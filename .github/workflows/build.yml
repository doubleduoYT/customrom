name: Build Overuse Controller APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify built APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OveruseController-v0.3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
